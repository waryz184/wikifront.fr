site_name: Wikifront
site_description: Wiki collaboratif pour l'Opel Frontera
site_url: https://frontopedia-121036105819.europe-west1.run.app
repo_url: https://github.com/waryz184/wikifront.fr
edit_uri: edit/main/docs/

theme: readthedocs

extra_css:
  - extra.css

extra_javascript:
  - translate.js

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Accueil: index.md
  - Diagnostic:
    - Codes Opel: diagnostic/codes-opel.md
    - Pannes fréquentes: diagnostic/pannes-frequentes.md
  - Mécanique:
    - Motorisation: mecanique/motorisation.md
    - Huiles et graissage: mecanique/huiles-et-graissage.md
    - Manuels d'atelier: mecanique/manuels-atelier.md
  - Frontera A:
    - Identification VIN: frontera-a/identification-vin.md
  - Frontera B:
    - Identification VIN: frontera-b/identification-vin.md
    - Démontage pare-chocs: frontera-b/pare-chocs.md
  - Mon véhicule:
    - Présentation: mon-vehicule/index.md