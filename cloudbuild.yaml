steps:
- name: 'gcr.io/cloud-builders/git'
  args: ['clone', 'https://github.com/waryz184/wikifront.fr', '/workspace']
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'europe-west1-docker.pkg.dev/waryz184-frontopedia/frontopedia/frontopedia:latest', '/workspace']
  dir: '/workspace'
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'europe-west1-docker.pkg.dev/waryz184-frontopedia/frontopedia/frontopedia:latest']
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args: ['run', 'deploy', 'frontopedia', '--image', 'europe-west1-docker.pkg.dev/waryz184-frontopedia/frontopedia/frontopedia:latest', '--region', 'europe-west1', '--platform', 'managed', '--allow-unauthenticated', '--memory', '256Mi', '--cpu', '1', '--min-instances', '0', '--max-instances', '5', '--concurrency', '80']
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
timeout: 600s